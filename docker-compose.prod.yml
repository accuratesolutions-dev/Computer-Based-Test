# Production overlay: automatic HTTPS via Caddy, app no longer exposed directly.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  app:
    ports: !reset []
    environment:
      TRUST_PROXY: "1"
      FORCE_SECURE_COOKIES: "1"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (e.g. exams.example.com)}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
