services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cbt_exam}
      DB_USER: ${DB_USER:-cbt}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Lagos}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-0}
      APP_DEBUG: ${APP_DEBUG:-0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - passports:/var/www/html/onlineForm/images/Student_Images
      - uploads:/var/www/html/uploads
      - backups:/var/www/html/backups

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cbt_exam}
      MYSQL_USER: ${DB_USER:-cbt}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      TZ: ${APP_TIMEZONE:-Africa/Lagos}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db_data:
  passports:
  uploads:
  backups:
